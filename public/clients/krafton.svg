<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 52">
  <!-- Krafton: black/gold gaming company (PUBG maker) -->
  <rect x="4" y="8" width="36" height="36" rx="6" fill="#1a1a1a" stroke="#C9A84C" stroke-width="2"/>
  <!-- K letter stylized -->
  <rect x="13" y="15" width="3" height="22" rx="1" fill="#C9A84C"/>
  <line x1="16" y1="26" x2="26" y2="15" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="26" x2="26" y2="37" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
  <!-- Name -->
  <text x="48" y="33" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="19" fill="#C9A84C" letter-spacing="1">KRAFTON</text>
</svg>
